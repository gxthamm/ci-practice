name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------- Задание 2: lint ----------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  # ---------- Задания 3–5: unit с matrix-shard, кэшем, JUnit, карантином ----------
  unit:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -m "not quarantine" --splits 4 --group ${{ matrix.python-version }} --junitxml=report-${{ matrix.shard }}.xml -v
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: name: junit-report-${{ matrix.python-version }}
          path: report-${{ matrix.shard }}.xml

  # ---------- Задание 5: карантин ----------
  quarantine:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -m quarantine -v

  # ---------- Задание 6: Docker ----------
  docker-tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ci-practice-tests .
      - run: docker run --rm ci-practice-tests

  # ---------- Задание 7: деплой-заглушка ----------
  deploy-staging:
    needs: [unit, docker-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Деплой на staging выполнен (имитация)"